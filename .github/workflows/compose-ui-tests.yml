name: Compose UI tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: compose-ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read

jobs:
  jvm:
    name: JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :client:composeApp:jvmTest --continue
      - name: Publish JVM test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Compose UI tests (JVM)
          path: 'client/composeApp/build/test-results/jvmTest/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-ui-test-jvm-report
          path: client/composeApp/build/reports/tests/jvmTest/

  android:
    name: Android (instrumented)
    # DISABLED pending TODO(agp9) in client/composeApp/build.gradle.kts: under the new KMP
    # Android library plugin the shared commonTest robot flows are not yet routed into
    # androidDeviceTest, so connectedAndroidDeviceTest runs zero tests and the report step
    # fails on empty results. Re-enable once the source-set routing is fixed — and verify the
    # androidTest-results / reports output paths below still match the new plugin's layout.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64
      - name: Create AVD and snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # AGP 9 KMP library plugin renamed connectedDebugAndroidTest ->
          # connectedAndroidDeviceTest. NOTE: the shared commonTest robot flows are not yet
          # routed into androidDeviceTest under the new plugin (see TODO(agp9) in
          # client/composeApp/build.gradle.kts), so this currently runs no instrumented tests.
          script: ./gradlew :client:composeApp:connectedAndroidDeviceTest --continue
      - name: Publish Android test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Compose UI tests (Android)
          path: 'client/composeApp/build/outputs/androidTest-results/connected/**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-ui-test-android-report
          path: client/composeApp/build/reports/androidTests/connected/

  ios:
    name: iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (iOS 26 SDK required by Compose 1.11)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native compiler and toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - run: ./gradlew :client:composeApp:iosSimulatorArm64Test --continue
      - name: Publish iOS test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Compose UI tests (iOS)
          path: 'client/composeApp/build/test-results/iosSimulatorArm64Test/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-ui-test-ios-report
          path: client/composeApp/build/reports/tests/iosSimulatorArm64Test/
